<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau projet — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2EDE3;--card:#FFFFFF;--text:#1A1A1A;--muted:#6B6660;--border:#E8E2D5;
    --primary:#2E2A5C;--primary-soft:#E8E4F0;--primary-light:#7165C8;--accent:#E8614A;
    --green-bg:#E8F1EA;--green:#2F6B43;
  }
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:2.5rem 1.5rem 6rem}
  .wrap{max-width:820px;margin:0 auto}
  header.top{margin-bottom:2rem}
  header.top h1{font-size:1.8rem;font-weight:600;letter-spacing:-.02em}
  header.top p{color:var(--muted);font-size:.95rem;margin-top:.35rem}
  .info-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--primary-soft);color:var(--primary);font-size:.78rem;font-weight:700;padding:.35rem .85rem;border-radius:100px;margin-top:.85rem}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.75rem;margin-bottom:1.5rem}
  .panel > h2{font-size:1.15rem;font-weight:600;letter-spacing:-.01em;margin-bottom:1.25rem;display:flex;align-items:center;gap:.6rem}
  .panel > h2 .num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}

  label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:var(--text)}
  .hint{font-size:.75rem;color:var(--muted);font-weight:400}
  input[type=text],textarea,select{
    width:100%;font-family:inherit;font-size:.9rem;color:var(--text);
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px var(--primary-soft)}
  textarea{resize:vertical;min-height:70px;line-height:1.6}
  .field{margin-bottom:1.1rem}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:640px){.row,.row-2{grid-template-columns:1fr}}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:background .15s,opacity .15s,transform .05s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff;font-size:1rem;padding:.9rem 1.5rem}
  .btn-primary:hover{background:var(--primary-light)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--primary-soft);color:var(--primary);font-size:.82rem;padding:.5rem .9rem}
  .btn-ghost:hover{background:#ded7ec}
  .btn-mini{background:transparent;color:var(--muted);font-size:.8rem;padding:.3rem .5rem;border:1px solid var(--border)}
  .btn-mini:hover{color:var(--text);border-color:var(--muted)}
  .btn-danger{background:transparent;color:var(--accent);font-size:.8rem;padding:.3rem .55rem;border:1px solid #f1cbc3}
  .btn-danger:hover{background:#fceae4}

  .section-card{border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.1rem;background:#fdfbf7}
  .section-head{display:flex;gap:.6rem;align-items:center;margin-bottom:1rem}
  .section-head input{font-weight:600}
  .toolbar{display:flex;gap:.4rem;flex-shrink:0}
  .block{border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.85rem;background:#fff;position:relative}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
  .block-type{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);background:var(--primary-soft);padding:.25rem .7rem;border-radius:100px}
  .repeat-item{border:1px dashed var(--border);border-radius:10px;padding:.85rem;margin-bottom:.7rem;background:#fdfbf7}
  .repeat-item .ri-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .repeat-item .ri-label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

  .add-block-bar{display:flex;gap:.5rem;align-items:center;margin-top:.5rem}
  .add-block-bar select{max-width:260px}

  .img-drop{border:1.5px dashed var(--border);border-radius:10px;padding:.9rem;text-align:center;background:#fdfbf7;cursor:pointer;transition:border-color .15s,background .15s}
  .img-drop:hover{border-color:var(--primary-light);background:#faf7f0}
  .img-drop input{display:none}
  .img-drop .ph{font-size:.82rem;color:var(--muted)}
  .img-preview{margin-top:.6rem;display:flex;align-items:center;gap:.7rem}
  .img-preview img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  .img-preview .fname{font-size:.78rem;color:var(--muted);word-break:break-all}

  .footer-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:2rem;margin-top:1rem;display:flex;flex-direction:column;gap:.75rem;align-items:flex-start}
  .status{font-size:.9rem;font-weight:600}
  .status.ok{color:var(--green)}
  .status.err{color:var(--accent)}
  .status a{color:var(--primary)}
  .tag-hint{font-size:.75rem;color:var(--muted);margin-top:.2rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Créer un nouveau projet</h1>
    <p>Remplis les champs, ajoute tes sections, puis publie. L'outil crée la page, la card d'accueil et la navigation.</p>
    <span class="info-pill" id="infoPill">Chargement…</span>
  </header>

  <!-- 1. Infos générales -->
  <div class="panel">
    <h2><span class="num">1</span> En-tête du projet</h2>
    <div class="field">
      <label>Titre du projet <span class="hint">— apparaît en grand titre. *mot* = <em>italique</em></span></label>
      <input type="text" id="title" placeholder="Améliorer le *recrutement* en garde d'enfants">
    </div>
    <div class="field">
      <label>Tags de l'en-tête <span class="hint">— séparés par des virgules</span></label>
      <input type="text" id="headerTags" placeholder="Web App, SAAS B2B">
    </div>
    <div class="row">
      <div class="field"><label>Entreprise</label><input type="text" id="company" placeholder="Mômji"></div>
      <div class="field"><label>Rôle</label><input type="text" id="role" placeholder="Product Designer"></div>
      <div class="field"><label>Année</label><input type="text" id="year" placeholder="2024"></div>
    </div>
  </div>

  <!-- 2. Card d'accueil -->
  <div class="panel">
    <h2><span class="num">2</span> Card sur la page d'accueil</h2>
    <div class="field">
      <label>Titre de la card <span class="hint">— *mot* = <em>italique</em></span></label>
      <input type="text" id="cardTitle" placeholder="Améliorer le *recrutement* en garde d'enfants">
    </div>
    <div class="field">
      <label>Description courte</label>
      <textarea id="cardDesc" placeholder="Conception d'une web app qui guide les recruteurs…"></textarea>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Tags de la card <span class="hint">— virgules</span></label>
        <input type="text" id="cardTags" placeholder="Web App, SAAS B2B">
      </div>
      <div class="field">
        <label>Position dans la grille</label>
        <select id="cardPosition">
          <option value="debut">Au début (projet le plus récent)</option>
          <option value="fin">À la fin</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Image de la card <span class="hint">— idéalement large (paysage)</span></label>
      <div id="cardImageDrop"></div>
    </div>
  </div>

  <!-- 3. Contenu -->
  <div class="panel">
    <h2><span class="num">3</span> Contenu de l'étude de cas</h2>
    <div id="sections"></div>
    <button class="btn-ghost" id="addSection">+ Ajouter une section</button>
  </div>

  <div class="footer-bar">
    <div class="status" id="status"></div>
    <button class="btn-primary" id="publish">Créer le projet</button>
  </div>
</div>

<script>
/* ───────── Modèle ───────── */
let uid = 0;
const nid = () => 'id' + (++uid);

const BLOCK_TYPES = {
  text:       'Texte / paragraphe',
  subheading: 'Sous-titre (+ description)',
  objectives: 'Grille d\'objectifs / chiffres',
  insights:   'Insights (pills violettes)',
  hmw:        'How Might We (pills)',
  statement:  'Encadré (statement)',
  twocol:     'Deux colonnes (image + légende)',
  decisions:  'Décisions clés (avant/problème/décision/impact)',
  moscow:     'Priorisation MoSCoW',
  image:      'Image simple',
  gallery:    'Galerie d\'images (avec légendes)',
};

const state = {
  sections: []
};

function newBlock(type){
  const b = { id: nid(), type };
  if(type==='objectives') b.items=[{number:'01',text:''},{number:'02',text:''},{number:'03',text:''}];
  if(type==='twocol') b.columns=[{label:'',image:null,caption:''},{label:'',image:null,caption:''}];
  if(type==='decisions') b.items=[{avant:'',probleme:'',decision:'',impact:''}];
  if(type==='gallery') b.items=[{image:null,alt:'',caption:''}];
  return b;
}
function newSection(){ return { id:nid(), title:'', blocks:[] }; }

/* ───────── Lecture image ───────── */
function readImageFile(file){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const dataUrl = r.result;
      const base64 = String(dataUrl).split(',')[1] || '';
      let ext = (file.name.split('.').pop()||'png').toLowerCase();
      if(!/^[a-z0-9]+$/.test(ext)) ext='png';
      resolve({__img:true, data:base64, ext, name:file.name, previewUrl:dataUrl});
    };
    r.readAsDataURL(file);
  });
}

/* Composant image réutilisable. target = objet+clé où stocker. */
function imageDrop(container, getVal, setVal){
  container.innerHTML='';
  const drop=document.createElement('label');
  drop.className='img-drop';
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*';
  const ph=document.createElement('span'); ph.className='ph'; ph.textContent='Cliquer pour choisir une image';
  drop.appendChild(ph); drop.appendChild(input);
  container.appendChild(drop);

  const preview=document.createElement('div');
  container.appendChild(preview);

  function renderPreview(){
    const v=getVal();
    preview.innerHTML='';
    if(v && v.previewUrl){
      const box=document.createElement('div'); box.className='img-preview';
      const img=document.createElement('img'); img.src=v.previewUrl;
      const meta=document.createElement('div');
      const fn=document.createElement('div'); fn.className='fname'; fn.textContent=v.name||'image';
      const rm=document.createElement('button'); rm.type='button'; rm.className='btn-danger'; rm.textContent='Retirer';
      rm.style.marginTop='.4rem';
      rm.onclick=(e)=>{e.preventDefault();setVal(null);renderPreview();ph.textContent='Cliquer pour choisir une image';};
      meta.appendChild(fn); meta.appendChild(rm);
      box.appendChild(img); box.appendChild(meta);
      preview.appendChild(box);
      ph.textContent='Changer l\'image';
    }
  }
  input.onchange=async()=>{
    if(input.files && input.files[0]){
      const v=await readImageFile(input.files[0]);
      setVal(v); renderPreview();
    }
  };
  renderPreview();
}

/* ───────── Rendu des sections ───────── */
const sectionsEl=document.getElementById('sections');

function render(){
  sectionsEl.innerHTML='';
  state.sections.forEach((sec,si)=>{
    const card=document.createElement('div'); card.className='section-card';

    const head=document.createElement('div'); head.className='section-head';
    const tin=document.createElement('input'); tin.type='text'; tin.placeholder='Titre de la section (ex : Discovery)';
    tin.value=sec.title; tin.oninput=()=>sec.title=tin.value;
    const tb=document.createElement('div'); tb.className='toolbar';
    tb.appendChild(mini('↑',()=>move(state.sections,si,-1)));
    tb.appendChild(mini('↓',()=>move(state.sections,si,1)));
    tb.appendChild(danger('Supprimer',()=>{state.sections.splice(si,1);render();}));
    head.appendChild(tin); head.appendChild(tb);
    card.appendChild(head);

    sec.blocks.forEach((b,bi)=>card.appendChild(renderBlock(sec,b,bi)));

    // barre d'ajout de bloc
    const bar=document.createElement('div'); bar.className='add-block-bar';
    const sel=document.createElement('select');
    Object.entries(BLOCK_TYPES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o);});
    const add=document.createElement('button'); add.type='button'; add.className='btn-ghost'; add.textContent='+ Ajouter un bloc';
    add.onclick=()=>{sec.blocks.push(newBlock(sel.value));render();};
    bar.appendChild(sel); bar.appendChild(add);
    card.appendChild(bar);

    sectionsEl.appendChild(card);
  });
}

function renderBlock(sec,b,bi){
  const el=document.createElement('div'); el.className='block';
  const head=document.createElement('div'); head.className='block-head';
  const tag=document.createElement('span'); tag.className='block-type'; tag.textContent=BLOCK_TYPES[b.type]||b.type;
  const tb=document.createElement('div'); tb.className='toolbar';
  tb.appendChild(mini('↑',()=>move(sec.blocks,bi,-1)));
  tb.appendChild(mini('↓',()=>move(sec.blocks,bi,1)));
  tb.appendChild(danger('✕',()=>{sec.blocks.splice(bi,1);render();}));
  head.appendChild(tag); head.appendChild(tb);
  el.appendChild(head);
  el.appendChild(blockFields(b));
  return el;
}

/* Champs par type de bloc */
function blockFields(b){
  const w=document.createElement('div');
  const add=(node)=>w.appendChild(node);

  const descField=(label)=>textareaField(label||'Texte d\'introduction (optionnel)', ()=>b.desc||'', v=>b.desc=v, 'Phrase d\'intro de la sous-partie…');

  if(b.type==='text'){
    add(textareaField('Paragraphe(s) — une ligne = un paragraphe. **gras**, *italique*',()=>b.text||'',v=>b.text=v,'Chez Mômji, le quotidien des recruteurs…'));
  }
  else if(b.type==='subheading'){
    add(inputField('Sous-titre (h3)',()=>b.heading||'',v=>b.heading=v,'Audit UX'));
    add(textareaField('Description (optionnel)',()=>b.desc||'',v=>b.desc=v,'J\'ai réalisé un audit UX…'));
  }
  else if(b.type==='objectives'){
    add(descField());
    add(repeater(b.items,()=>({number:'',text:''}),'Élément',(it)=>{
      const box=document.createElement('div');
      box.appendChild(inputField('Chiffre / numéro',()=>it.number,v=>it.number=v,'01  ·  100 %  ·  5 étapes'));
      box.appendChild(textareaField('Texte',()=>it.text,v=>it.text=v,'Permettre aux recruteurs de…'));
      return box;
    }));
  }
  else if(b.type==='insights'||b.type==='hmw'){
    add(descField());
    add(textareaField('Éléments — une ligne = une pill. **gras**, *italique*',()=>b.items||'',v=>b.items=v,'Un point par ligne…'));
  }
  else if(b.type==='statement'){
    add(textareaField('Texte de l\'encadré',()=>b.text||'',v=>b.text=v,'En tant que…, je veux…, afin de…'));
  }
  else if(b.type==='image'){
    add(imgField('Image',b,'image'));
    add(inputField('Texte alternatif (alt)',()=>b.alt||'',v=>b.alt=v,'Description de l\'image'));
  }
  else if(b.type==='twocol'){
    add(descField());
    b.columns.forEach((c,i)=>{
      const box=document.createElement('div'); box.className='repeat-item';
      const rh=document.createElement('div'); rh.className='ri-head';
      const lbl=document.createElement('span'); lbl.className='ri-label'; lbl.textContent='Colonne '+(i+1);
      rh.appendChild(lbl); box.appendChild(rh);
      box.appendChild(inputField('Titre de la colonne',()=>c.label,v=>c.label=v,'Persona'));
      box.appendChild(imgField('Image',c,'image'));
      box.appendChild(inputField('Légende (optionnel, en italique)',()=>c.caption,v=>c.caption=v,'Le pain point nous a orienté vers…'));
      w.appendChild(box);
    });
  }
  else if(b.type==='decisions'){
    add(descField());
    add(repeater(b.items,()=>({avant:'',probleme:'',decision:'',impact:''}),'Décision',(it)=>{
      const box=document.createElement('div');
      box.appendChild(textareaField('Avant',()=>it.avant,v=>it.avant=v,'L\'interface n\'est pas responsive.'));
      box.appendChild(textareaField('Problème',()=>it.probleme,v=>it.probleme=v,'Les équipes doivent scroller…'));
      box.appendChild(textareaField('Décision',()=>it.decision,v=>it.decision=v,'Rendre les pages responsive…'));
      box.appendChild(textareaField('Impact attendu',()=>it.impact,v=>it.impact=v,'Une interface lisible sur tous les écrans…'));
      return box;
    }));
  }
  else if(b.type==='moscow'){
    add(descField());
    add(textareaField('Must have — une ligne par élément',()=>b.must||'',v=>b.must=v,'Chercher la fiche candidat\nAccéder à la fiche…'));
    add(textareaField('Should have',()=>b.should||'',v=>b.should=v,''));
    add(textareaField('Nice to have',()=>b.nice||'',v=>b.nice=v,''));
    add(textareaField('Won\'t do',()=>b.wont||'',v=>b.wont=v,''));
  }
  else if(b.type==='gallery'){
    add(descField());
    add(repeater(b.items,()=>({image:null,alt:'',caption:''}),'Image',(it)=>{
      const box=document.createElement('div');
      box.appendChild(imgField('Image',it,'image'));
      box.appendChild(inputField('Texte alternatif (alt)',()=>it.alt,v=>it.alt=v,'Liste de résultats'));
      box.appendChild(inputField('Légende',()=>it.caption,v=>it.caption=v,'La liste de résultat permet de…'));
      return box;
    }));
  }
  return w;
}

/* ───────── Fabriques de champs ───────── */
function inputField(label,get,set,ph){
  const f=document.createElement('div'); f.className='field';
  const l=document.createElement('label'); l.textContent=label;
  const i=document.createElement('input'); i.type='text'; i.value=get()||''; i.placeholder=ph||'';
  i.oninput=()=>set(i.value);
  f.appendChild(l); f.appendChild(i); return f;
}
function textareaField(label,get,set,ph){
  const f=document.createElement('div'); f.className='field';
  const l=document.createElement('label'); l.textContent=label;
  const t=document.createElement('textarea'); t.value=get()||''; t.placeholder=ph||'';
  t.oninput=()=>set(t.value);
  f.appendChild(l); f.appendChild(t); return f;
}
function imgField(label,obj,key){
  const f=document.createElement('div'); f.className='field';
  const l=document.createElement('label'); l.textContent=label;
  const c=document.createElement('div');
  f.appendChild(l); f.appendChild(c);
  imageDrop(c,()=>obj[key],(v)=>obj[key]=v);
  return f;
}
function repeater(arr,factory,labelWord,renderItem){
  const w=document.createElement('div');
  arr.forEach((it,i)=>{
    const box=document.createElement('div'); box.className='repeat-item';
    const rh=document.createElement('div'); rh.className='ri-head';
    const lbl=document.createElement('span'); lbl.className='ri-label'; lbl.textContent=labelWord+' '+(i+1);
    const tb=document.createElement('div'); tb.className='toolbar';
    tb.appendChild(mini('↑',()=>move(arr,i,-1)));
    tb.appendChild(mini('↓',()=>move(arr,i,1)));
    tb.appendChild(danger('✕',()=>{arr.splice(i,1);render();}));
    rh.appendChild(lbl); rh.appendChild(tb); box.appendChild(rh);
    box.appendChild(renderItem(it));
    w.appendChild(box);
  });
  const add=document.createElement('button'); add.type='button'; add.className='btn-mini'; add.textContent='+ Ajouter';
  add.onclick=()=>{arr.push(factory());render();};
  w.appendChild(add);
  return w;
}
function mini(txt,fn){const b=document.createElement('button');b.type='button';b.className='btn-mini';b.textContent=txt;b.onclick=fn;return b;}
function danger(txt,fn){const b=document.createElement('button');b.type='button';b.className='btn-danger';b.textContent=txt;b.onclick=fn;return b;}
function move(arr,i,dir){const j=i+dir;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;render();}

/* ───────── En-tête / card image ───────── */
const cardImageState={image:null};
imageDrop(document.getElementById('cardImageDrop'),()=>cardImageState.image,v=>cardImageState.image=v);

/* ───────── Infos serveur ───────── */
const infoPill=document.getElementById('infoPill');
fetch('/api/info').then(r=>r.json()).then(d=>{
  infoPill.textContent=`Prochain fichier : projet${d.nextNumber}.html · suit « ${d.lastTitle} »`;
  if(!document.getElementById('year').value) document.getElementById('year').value=d.year;
}).catch(()=>infoPill.textContent='Serveur injoignable');

/* ───────── Publication ───────── */
const tagsSplit=(v)=>String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
const stripImg=(img)=>img?{__img:true,data:img.data,ext:img.ext}:null;

function cleanBlocks(blocks){
  return blocks.map(b=>{
    const o={type:b.type};
    ['text','heading','desc','items','must','should','nice','wont','alt','caption','number'].forEach(k=>{if(b[k]!=null)o[k]=b[k];});
    if(b.type==='objectives') o.items=(b.items||[]).map(it=>({number:it.number,text:it.text}));
    if(b.type==='decisions') o.items=(b.items||[]).map(it=>({avant:it.avant,probleme:it.probleme,decision:it.decision,impact:it.impact}));
    if(b.type==='gallery') o.items=(b.items||[]).map(it=>({image:stripImg(it.image),alt:it.alt,caption:it.caption}));
    if(b.type==='image') o.image=stripImg(b.image);
    if(b.type==='twocol') o.columns=(b.columns||[]).map(c=>({label:c.label,image:stripImg(c.image),caption:c.caption}));
    return o;
  });
}

document.getElementById('publish').onclick=async()=>{
  const status=document.getElementById('status');
  const btn=document.getElementById('publish');
  const g=(id)=>document.getElementById(id).value.trim();

  if(!g('title')){status.className='status err';status.textContent='Ajoute au moins un titre de projet.';return;}

  const payload={
    title:g('title'),
    headerTags:tagsSplit(g('headerTags')),
    company:g('company'),
    role:g('role'),
    year:g('year'),
    cardTitle:g('cardTitle')||g('title'),
    cardDesc:g('cardDesc'),
    cardTags:tagsSplit(g('cardTags')),
    cardPosition:g('cardPosition'),
    cardImage:stripImg(cardImageState.image),
    sections:state.sections.map(s=>({title:s.title,blocks:cleanBlocks(s.blocks)}))
  };

  btn.disabled=true; status.className='status'; status.textContent='Création en cours…';
  try{
    const r=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.ok){
      status.className='status ok';
      status.innerHTML=`✅ Créé : <strong>${d.file}</strong> · card ajoutée à l'accueil · navigation mise à jour. `+
        `<a href="/../${d.file}" target="_blank">Ouvrir la page</a>`;
    }else{
      status.className='status err'; status.textContent='Erreur : '+(d.error||'inconnue');
    }
  }catch(e){
    status.className='status err'; status.textContent='Erreur réseau : '+e.message;
  }
  btn.disabled=false;
};

/* Démarrage : une section vide */
state.sections.push(newSection());
render();
</script>
</body>
</html>
